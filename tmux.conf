unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g mouse on
set -sg escape-time 10
# Enable vi-mode for copy mode
set -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -U
bind-key k select-pane -D
bind-key l select-pane -R 
bind-key b run-shell "tmux neww ~/.config/tmux/tmux-sessionizer.sh"
bind-key c-b run-shell "tmux neww ~/.config/tmux/tmux-sessionizer.sh"

# Moves to topjpane and zoom it (if above pane exists)
unbind t
bind t run-shell "~/.config/tmux/terminal-swap.sh"

# Had to disable this fix because i was pasting unescaped text into nvim on cmd+v
# # Fixes tmux special characters not being sent to nvim
# set -s extended-keys on

# Bind windows splitting mapping
unbind %
bind-key v split-window -h -c "#{pane_current_path}" 
unbind '"'
unbind s
bind-key s split-window -v -c "#{pane_current_path}"  

# Start windows and panes from 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Map pane management
unbind q 
bind-key q kill-pane
unbind x
bind-key x display-panes
# Set position of a status bar
set-option -g status-position top

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#latest'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Making colors right!
set-option -ga terminal-overrides ".xterm*:Tc"

# Configure catppuccin
set -g @catppuccin_flavor 'macchiato' # latte,frappe, macchiato or mocha
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '$HOME/.config/tmux/plugins/tpm/tpm'
